<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-5">

            <div class="card shadow">

                <div class="card-body p-5">

                    <div class="text-center mb-4">
                        <p >
                            Forgot Password Form
                        </p>

                    </div>

                    <form id="frmLogin">

                        <div class="mb-3">

                            <label class="form-label">
                                Username or Email
                            </label>

                            <input
                                id="txtUserName"
                                type="text"
                                class="form-control"
                                autocomplete="username"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                id="txtPassword"
                                type="password"
                                class="form-control"
                                autocomplete="current-password"
                                required>
                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Retype Password
                            </label>

                            <input
                                id="txtRetypePassword"
                                type="password"
                                class="form-control"
                                required>

                        </div>

                        

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Submit

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

$("#frmLogin").on("submit", async function (e) {

    e.preventDefault();

    try {

        let payload = {

            actionCode: "CLIENT_LOGIN",

            parameters: {

                UserName:
                    $("#txtUserName").val(),

                Password:
                    $("#txtPassword").val()

            }

        };

        let result = await $.ajax({

            url:
                API_URL,

            method:
                "POST",

            contentType:
                "application/json",

            data:
                JSON.stringify(payload)

        });

        localStorage.setItem(
            "access_token",
            result.data.accessToken
        );

        localStorage.setItem(
            "refresh_token",
            result.data.refreshToken
        );

        localStorage.setItem(
            "user",
            JSON.stringify(result.data.user)
        );

        location.hash =
            "#/dashboard";

    }
    catch (ex) {

        alert(
            ex.responseJSON?.message ??
            "Login failed."
        );

    }

});

$("#btnGoogleLogin").on("click", function () {

    // Google Auth

});

</script>
